      package: "@dataconnect/generated"
      packageJsonDir: ..\..\firebase-backend\functions
      react: false
      angular: false
  kotlinSdk:
    - outputDir: ..\..\android-app\app\src\main\kotlin
      package: com.google.firebase.dataconnect.generated
