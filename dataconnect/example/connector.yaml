      packageJsonDir: ..\..
      react: false
      angular: false
    - outputDir: ..\..\firebase-backend\src\dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ..\..\firebase-backend
      react: false
      angular: false
