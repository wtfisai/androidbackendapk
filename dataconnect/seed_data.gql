mutation SeedData @auth(level: USER) {
  device_upsertMany(data: [
    {
      id: "11111111-1111-1111-1111-111111111111",
      name: "Device 1",
      isOnline: true
    },
    {
      id: "22222222-2222-2222-2222-222222222222",
      name: "Device 2",
      isOnline: false
    }
  ])
  command_upsertMany(data: [
    {
      id: "33333333-3333-3333-3333-333333333333",
      name: "Command 1",
      payload: "Payload 1"
    },
    {
      id: "44444444-4444-4444-4444-444444444444",
      name: "Command 2",
      payload: "Payload 2"
    }
  ])
  commandLog_upsertMany(data: [
    {
      commandId: "33333333-3333-3333-3333-333333333333",
      deviceId: "11111111-1111-1111-1111-111111111111",
      outcome: "Success",
      sentAt: "2024-01-01T00:00:00Z"
    },
    {
      commandId: "44444444-4444-4444-4444-444444444444",
      deviceId: "22222222-2222-2222-2222-222222222222",
      outcome: "Failure",
      sentAt: "2024-01-02T00:00:00Z"
    }
  ])
}