name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  test-firebase-integration:
    runs-on: ubuntu-latest
    
    services:
      firebase:
        image: firebase/emulators
        ports:
          - 9099:9099  # Auth
          - 8080:8080  # Firestore
          - 9000:9000  # Functions
          - 5001:5001  # Storage
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: firebase-backend/functions/package-lock.json
    
    - name: Install Firebase tools
      run: npm install -g firebase-tools
    
    - name: Install backend dependencies
      run: |
        cd firebase-backend/functions
        npm ci
    
    - name: Start Firebase emulators
      run: |
        cd firebase-backend
        firebase emulators:start --only auth,firestore,functions,storage --project test &
        sleep 10
    
    - name: Run integration tests
      run: |
        cd firebase-backend/functions
        npm run test:integration
      env:
        FIRESTORE_EMULATOR_HOST: localhost:8080
        FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
        
  test-android-integration:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Create AVD
      run: |
        echo "y" | sdkmanager --install "system-images;android-30;google_apis;x86_64"
        echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64"
    
    - name: Start emulator
      run: |
        nohup $ANDROID_HOME/emulator/emulator -avd test -no-snapshot-save -no-window -gpu host -noaudio -no-boot-anim &
        adb wait-for-device
        adb shell input keyevent 82
    
    - name: Run instrumented tests
      run: |
        cd android-app
        ./gradlew connectedAndroidTest
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: android-test-results
        path: android-app/app/build/reports/androidTests/
