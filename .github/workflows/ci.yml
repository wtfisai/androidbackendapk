name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '11'

jobs:
  test-firebase:
    name: Test Firebase Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'firebase-backend/functions/package-lock.json'
    
    - name: Install Firebase dependencies
      run: |
        cd firebase-backend/functions
        npm ci
    
    - name: Lint Firebase code
      run: |
        cd firebase-backend/functions
        npm run lint
    
    - name: Build Firebase functions
      run: |
        cd firebase-backend/functions
        npm run build
    
    - name: Test Firebase functions
      run: |
        cd firebase-backend/functions
        npm test

  test-android:
    name: Test Android App
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Make gradlew executable
      run: chmod +x android-app/gradlew
    
    - name: Lint Android code
      run: |
        cd android-app
        ./gradlew lintDebug
    
    - name: Run Android tests
      run: |
        cd android-app
        ./gradlew test
    
    - name: Build Android APK
      run: |
        cd android-app
        ./gradlew assembleDebug

  test-web:
    name: Test Web Dashboard
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'web-dashboard/package-lock.json'
    
    - name: Install web dependencies
      run: |
        if [ -d "web-dashboard" ]; then
          cd web-dashboard
          npm ci
        else
          echo "Web dashboard not yet implemented"
        fi
    
    - name: Lint web code
      run: |
        if [ -d "web-dashboard" ]; then
          cd web-dashboard
          npm run lint
        fi
    
    - name: Test web app
      run: |
        if [ -d "web-dashboard" ]; then
          cd web-dashboard
          npm test
        fi
    
    - name: Build web app
      run: |
        if [ -d "web-dashboard" ]; then
          cd web-dashboard
          npm run build
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run npm audit
      run: |
        cd firebase-backend/functions
        npm audit --audit-level high
    
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        command: test
      continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-firebase, test-android, test-web]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: Install dependencies
      run: |
        cd firebase-backend/functions
        npm ci
    
    - name: Build functions
      run: |
        cd firebase-backend/functions
        npm run build
    
    - name: Deploy to Firebase Staging
      run: |
        cd firebase-backend
        firebase deploy --only functions,firestore,storage --project staging
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-firebase, test-android, test-web, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: Install dependencies
      run: |
        cd firebase-backend/functions
        npm ci
    
    - name: Build functions
      run: |
        cd firebase-backend/functions
        npm run build
    
    - name: Deploy to Firebase Production
      run: |
        cd firebase-backend
        firebase deploy --only functions,firestore,storage --project production
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    
    - name: Create GitHub Release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Changes in this Release:
          - Backend functions deployed to production
          - Android APK build successful
          - All tests passing
        draft: false
        prerelease: false

  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Make gradlew executable
      run: chmod +x android-app/gradlew
    
    - name: Build release APK
      run: |
        cd android-app
        ./gradlew assembleRelease
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: android-release-apk
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30