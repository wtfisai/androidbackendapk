name: Android Build and Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x ./android-app/gradlew
      
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > ./android-app/local.properties
    
    - name: Run unit tests
      run: |
        cd android-app
        ./gradlew test
      
    - name: Build debug APK
      run: |
        cd android-app
        ./gradlew assembleDebug
      
    - name: Build release APK
      run: |
        cd android-app
        ./gradlew assembleRelease
      
    - name: Upload debug APK
      uses: actions/upload-artifact@v3
      with:
        name: debug-apk
        path: android-app/app/build/outputs/apk/debug/*.apk
        
    - name: Upload release APK
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: android-app/app/build/outputs/apk/release/*.apk
        
    - name: Run lint
      run: |
        cd android-app
        ./gradlew lint
        
    - name: Upload lint results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: lint-results
        path: android-app/app/build/reports/lint-results-*.html
